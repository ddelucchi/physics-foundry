[tool.poetry]
name = "physics-foundry-orchestrator"
version = "0.3.0"
description = "Prototype FastAPI orchestrator for local-first physics-media workflows"
authors = ["Daxx Delucchi"]

[tool.poetry.dependencies]
python = "^3.11,<3.13"

# Core API Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
websockets = "^12.0"
pydantic = "^2.5.0"

# Media & Timeline Processing
opentimelineio = "^0.16.0"
opencv-python = "^4.8.0"
pillow = "^10.0.0"
numpy = "^1.24.0"
openimageio = "^3.0.6"

# AI & LLM Integration
openai = "^1.3.0"
httpx = "^0.25.0"
transformers = "^4.35.0"

# Audio Processing
soundfile = "^0.12.0"
librosa = "^0.10.0"

# Observability Stack
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
opentelemetry-exporter-jaeger-thrift = "^1.21.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.40.0"}

# Process Management & Reliability
psutil = "^5.9.0"
tenacity = "^8.2.0"
watchdog = "^3.0.0"

# Quality Assurance
scikit-image = "^0.21.0"
ffmpeg-python = "^0.2.0"

# Development Tools
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
hypothesis = "^6.88.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
pre-commit = "^3.5.0"
types-requests = "^2.31.0"
types-pillow = "^10.1.0"

[tool.poetry.group.optional.dependencies]
pynvml = "^11.5.0"
PyOpenColorIO = "^2.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "sklearn.*",
    "OpenImageIO.*",
    "PyOpenColorIO.*",
    "pynvml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=orchestrator --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["orchestrator"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
