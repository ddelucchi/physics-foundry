name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  orchestrator:
    name: Orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov ruff black
      - name: Compile
        run: python -m compileall -q orchestrator
      - name: Lint
        run: ruff check orchestrator tests
      - name: Format check
        run: black --check orchestrator tests
      - name: Unit tests
        run: pytest -q
