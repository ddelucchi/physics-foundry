name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gui:
    name: GUI test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  orchestrator:
    name: Orchestrator syntax and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package shell and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pytest-asyncio pytest-cov
      - name: Compile Python sources
        run: python -m compileall -q orchestrator
      - name: Unit tests
        run: pytest -q
